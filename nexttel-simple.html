<!doctype html>
<html lang="en" data-theme="petrol"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NextTel Prototype (simplified)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Lora:wght@500;600&display=swap" rel="stylesheet">
<style>


:root {
  --bg: #f5f7fa; --surface: #fff; --ink: #0b1220; --ink2: #475467; --ink3: #98a2b3; --line: #e6e9ef; --line2: #f0f2f5;
  --brand: #12a150; --brand-d: #0e8a44; --brand-50: #ebf9f1; --brand-100: #d3f3e1;
  --ai: #5b5bf0; --ai-50: #eef0ff; --ai-100: #dfe2ff;
  --amber: #f59e0b; --amber-50: #fff7e6; --red: #ef4444; --red-50: #fdecec; --blue: #2f7cf6; --blue-50: #eaf2ff;
  --r: 14px; --r-lg: 20px;
  --sh: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 16px rgba(16, 24, 40, .06);
  --sh-lg: 0 12px 40px rgba(16, 24, 40, .14);
}
* { box-sizing: border-box; margin: 0; padding: 0; }

body { font-family: Inter, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; position: relative; }
.ic { width: 18px; height: 18px; flex: none; }
b, strong { font-weight: 600; }

/* nav */
.nav { height: 60px; background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 28px; gap: 36px; position: relative; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
.logo { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, #12a150, #0ea5a4 60%, #5b5bf0); display: grid; place-items: center; color: #fff; box-shadow: 0 4px 12px rgba(18, 161, 80, .3); }
.logo .ic { width: 18px; height: 18px; }
.tabs { display: flex; gap: 6px; height: 100%; }
.tabs a { display: flex; align-items: center; padding: 0 14px; color: var(--ink2); font-weight: 500; position: relative; }
.tabs a.on { color: var(--ink); font-weight: 600; }
.tabs a.on::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--brand); }
.nav-r { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.nsearch { width: 260px; height: 38px; border: 1px solid var(--line); border-radius: 10px; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: var(--ink3); background: var(--bg); }
.nsearch span { flex: 1; font-size: 13px; }
kbd { font: 500 11px Inter; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; background: #fff; color: var(--ink2); }
.credits { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ai); background: var(--ai-50); padding: 7px 12px; border-radius: 999px; }
.credits .ic { width: 15px; height: 15px; }
.nbtn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink2); position: relative; border: 1px solid var(--line); }
.nbtn .dot { position: absolute; top: 8px; right: 9px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); border: 2px solid #fff; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #f7b267, #f4845f); color: #fff; font-weight: 700; font-size: 13px; display: grid; place-items: center; }

/* primitives */
.page { padding: 28px 40px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--sh); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 11px; font-weight: 600; font-size: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); white-space: nowrap; }
.btn.pri { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 6px 16px rgba(18, 161, 80, .28); }
.btn.ai { background: var(--ai); border-color: var(--ai); color: #fff; box-shadow: 0 6px 16px rgba(91, 91, 240, .28); }
.btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.sm { height: 34px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn .ic { width: 16px; height: 16px; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 11px; border-radius: 999px; font-size: 12.5px; font-weight: 500; background: var(--line2); color: var(--ink2); white-space: nowrap; }
.chip .ic { width: 14px; height: 14px; }
.chip.g { background: var(--brand-50); color: var(--brand-d); }
.chip.a { background: var(--ai-50); color: var(--ai); }
.chip.o { background: var(--amber-50); color: #b45309; }
.chip.r { background: var(--red-50); color: #b91c1c; }
.chip.b { background: var(--blue-50); color: var(--blue); }
.chip.line { background: #fff; border: 1px solid var(--line); }
.h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.025em; }
.h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
.h3 { font-size: 15px; font-weight: 600; }
.muted { color: var(--ink2); }
.faint { color: var(--ink3); }
.row { display: flex; align-items: center; }
.gap4 { gap: 4px; } .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap12 { gap: 12px; } .gap16 { gap: 16px; } .gap20 { gap: 20px; }
.sp { flex: 1; }
.col { display: flex; flex-direction: column; }
.ib { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; flex: none; }
.ib.g { background: var(--brand-50); color: var(--brand); } .ib.a { background: var(--ai-50); color: var(--ai); } .ib.o { background: var(--amber-50); color: var(--amber); } .ib.b { background: var(--blue-50); color: var(--blue); } .ib.r { background: var(--red-50); color: var(--red); }
.bar { height: 8px; border-radius: 99px; background: var(--line2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--brand); width: var(--w, 0%); }
.logoq { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 16px; flex: none; }
.input { height: 42px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; display: flex; align-items: center; background: #fff; font-size: 14px; color: var(--ink); }
.label { font-size: 12.5px; font-weight: 500; color: var(--ink2); margin-bottom: 6px; }
.typing::after { content: ''; display: inline-block; width: 2px; height: 1.05em; background: currentColor; margin-left: 2px; vertical-align: -2px; animation: blink .8s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

/* motion helpers — elements with .rise etc. animate when .show is added */
.rise { opacity: 0; transform: translateY(14px); }
.rise.show { animation: rise .55s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.fade { opacity: 0; }
.fade.show { animation: fadein .45s ease both; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.pop { opacity: 0; transform: scale(.92); }
.pop.show { animation: pop .45s cubic-bezier(.2, 1.3, .4, 1) both; }
@keyframes pop { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }
.hide.show { animation: fadeout .35s ease both; }
@keyframes fadeout { to { opacity: 0; transform: translateY(-8px); } }
.spin { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--brand-100); border-top-color: var(--brand); animation: spin .9s linear infinite; flex: none; }
.shimmer { background: linear-gradient(90deg, #eef1f5 0%, #f8fafc 50%, #eef1f5 100%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; border-radius: 6px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

/* screens (for multi-step flows inside one GIF) */
.scr { position: absolute; left: 0; right: 0; top: 60px; bottom: 0; opacity: 0; pointer-events: none; }
.scr.on { animation: scrin .55s cubic-bezier(.2, .8, .2, 1) both; }
.scr.off { animation: scrout .4s ease both; }
@keyframes scrin { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes scrout { from { opacity: 1; } to { opacity: 0; transform: translateX(-28px); } }
.scr.first { opacity: 1; }

/* cursor + ripple */
#cursor { position: fixed; left: -3px; top: -2px; z-index: 999; pointer-events: none; transform-origin: 3px 2px; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .25)); }
.ripple { position: fixed; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(18, 161, 80, .28); z-index: 998; pointer-events: none; animation: rip .55s ease-out both; }
@keyframes rip { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

/* ---------- shell ---------- */
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #dfe4ec; }
#stage { position: fixed; inset: 0; background: radial-gradient(1200px 700px at 50% 0%, #eef1f6, #d8dee8); }
#frame { position: absolute; left: 0; top: 0; width: 1280px; height: 800px; overflow: hidden; transform-origin: 0 0; background: #fff; border-radius: 14px;
  box-shadow: 0 30px 80px rgba(15, 23, 42, .25), 0 0 0 1px rgba(15, 23, 42, .06); }
.view { position: absolute; inset: 0; overflow: hidden; animation: viewin .35s cubic-bezier(.2, .8, .2, 1) both; background: #fff; }
.view.scroll { overflow-y: auto; }
.view::-webkit-scrollbar { width: 8px; } .view::-webkit-scrollbar-thumb { background: #d0d6e0; border-radius: 8px; }
@keyframes viewin { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
#frame [data-go], #frame .btn, #frame .tile, #frame .seg span, #frame .tchip, #frame .jrow, #frame .arow, #frame .acc2, #frame .tp, #frame .sw2 i, #frame .imp2 .ih, #frame .opt2, #frame .tabs2 span { cursor: pointer; }
#frame .btn { transition: transform .15s, filter .2s, background .2s; }
#frame .btn:hover { filter: brightness(.97); }
#frame .btn:active { transform: scale(.97); }
#frame .btn.dis { opacity: .45; pointer-events: none; box-shadow: none; }
.btn.blk { background: var(--ink); color: #fff; border-color: var(--ink); }
.btn.lg { height: 48px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
#frame .pop:not(.show), #frame .fade:not(.show), #frame .rise:not(.show) { pointer-events: none; }

/* ---------- top nav: logo, 4 tabs, avatar ---------- */
.nav2 { height: 64px; display: flex; align-items: center; gap: 40px; padding: 0 40px; border-bottom: 1px solid var(--line); background: #fff; position: relative; z-index: 5; }
.nav2 .tabs { display: flex; gap: 4px; height: auto; }
.nav2 .tabs a.on::after { display: none; }
.nav2 .tabs a { padding: 8px 14px; border-radius: 10px; font-weight: 500; color: var(--ink2); font-size: 14.5px; }
.nav2 .tabs a:hover { background: var(--bg); color: var(--ink); }
.nav2 .tabs a.on { background: var(--bg); color: var(--ink); font-weight: 600; }
.nav2 .avatar { margin-left: auto; cursor: pointer; }

/* ---------- page layout ---------- */
.pg { padding: 36px 56px; }
.pg h1 { font-size: 30px; letter-spacing: -.03em; font-weight: 700; }
.pg .lead { color: var(--ink2); margin-top: 6px; font-size: 15px; }
.lbl { font-size: 13px; font-weight: 600; color: var(--ink); margin: 22px 0 10px; display: flex; align-items: center; gap: 8px; }
.lbl small { font-weight: 400; color: var(--ink3); font-size: 12.5px; }

/* segmented control */
.seg { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 2px; }
.seg span { padding: 8px 16px; border-radius: 9px; font-size: 13.5px; font-weight: 500; color: var(--ink2); transition: all .2s; white-space: nowrap; }
.seg span.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(16, 24, 40, .1); }

/* selectable tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { border: 1.5px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; transition: border-color .2s, box-shadow .2s, background .2s; background: #fff; }
.tile .ib { width: 36px; height: 36px; border-radius: 10px; }
.tile .ib .ic { width: 17px; height: 17px; }
.tile b { display: block; font-size: 14px; }
.tile small { display: block; color: var(--ink3); font-size: 12px; margin-top: 1px; }
.tile.on { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(11, 18, 32, .06); }
.tchip { height: 34px; padding: 0 14px; border-radius: 99px; border: 1.5px solid var(--line); display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; background: #fff; transition: all .2s; margin: 0 6px 8px 0; }
.tchip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
.tchip .ic { width: 14px; height: 14px; }

/* sticky action bar */
.actbar { position: absolute; left: 0; right: 0; bottom: 0; height: 76px; border-top: 1px solid var(--line); background: rgba(255, 255, 255, .96); display: flex; align-items: center; gap: 14px; padding: 0 56px; backdrop-filter: blur(6px); z-index: 4; }

/* list rows */
.jrow, .arow { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; border: 1.5px solid transparent; transition: background .2s, border-color .2s; }
.jrow:hover, .arow:hover { background: var(--bg); }
.jrow.on { border-color: var(--ink); background: #fff; }
.jrow .t, .arow .t { font-weight: 600; font-size: 14.5px; }
.jrow .m, .arow .m { font-size: 12.5px; color: var(--ink3); margin-top: 2px; }
.mring { --p: 0; width: 44px; height: 44px; border-radius: 50%; background: conic-gradient(var(--c, var(--brand)) calc(var(--p) * 1%), var(--line2) 0); display: grid; place-items: center; flex: none; }
.mring b { width: 35px; height: 35px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 12px; }

/* side panel (tailor & apply) */
.dim { position: absolute; inset: 0; background: rgba(11, 18, 32, .35); z-index: 50; animation: fadein .25s ease both; }
.sheet { position: absolute; top: 0; right: 0; bottom: 0; width: 540px; background: #fff; z-index: 51; box-shadow: -20px 0 60px rgba(15, 23, 42, .18); display: flex; flex-direction: column; animation: sheetin .4s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes sheetin { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet .sh { padding: 22px 26px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.sheet .sb { flex: 1; overflow-y: auto; padding: 22px 26px; }
.sheet .sf { padding: 16px 26px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.steps3 { display: flex; gap: 6px; padding: 0 26px; margin-top: 14px; }
.steps3 div { flex: 1; font-size: 12px; font-weight: 600; color: var(--ink3); }
.steps3 div i { display: block; height: 4px; border-radius: 3px; background: var(--line); margin-bottom: 6px; }
.steps3 div.on { color: var(--ink); } .steps3 div.on i { background: var(--ink); }
.steps3 div.dn { color: var(--brand-d); } .steps3 div.dn i { background: var(--brand); }
.edit2 { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; font-size: 13px; line-height: 1.55; transition: opacity .2s; }
.edit2 .et { display: flex; align-items: center; font-weight: 600; font-size: 12.5px; color: var(--ink2); margin-bottom: 4px; }
.edit2 .et span { margin-left: auto; }
.edit2 del { color: #b91c1c; background: #fdecec; border-radius: 3px; padding: 0 2px; }
.edit2 ins { color: #0b5a2f; background: var(--brand-50); text-decoration: none; border-radius: 3px; padding: 0 2px; }
.edit2.off { opacity: .5; }
.opt2 { border: 1.5px solid var(--line); border-radius: 14px; padding: 16px; display: flex; gap: 14px; align-items: flex-start; margin-bottom: 10px; transition: border-color .2s; }
.opt2.on { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(11, 18, 32, .06); }
.opt2.na { opacity: .5; pointer-events: none; }
.opt2 b { display: block; font-size: 14.5px; }
.opt2 small { display: block; color: var(--ink2); font-size: 12.5px; margin-top: 3px; line-height: 1.45; }
.pline { display: flex; align-items: center; gap: 10px; padding: 9px 0; font-size: 13.5px; color: var(--ink3); }
.pline .d { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; flex: none; }
.pline .d .ic { width: 11px; height: 11px; stroke-width: 3; color: #fff; display: none; }
.pline.run { color: var(--ink); } .pline.run .d { border-color: var(--brand-100); border-top-color: var(--brand); animation: spin .8s linear infinite; }
.pline.ok { color: var(--ink); } .pline.ok .d { background: var(--brand); border-color: var(--brand); animation: none; } .pline.ok .d .ic { display: block; }

/* modal */
.mdl { position: absolute; left: 50%; top: 50%; width: 560px; transform: translate(-50%, -50%); background: #fff; border-radius: 20px; z-index: 51; box-shadow: 0 20px 60px rgba(15, 23, 42, .25); padding: 24px; }
.mdl.in { animation: mdlin .35s cubic-bezier(.2, 1.1, .4, 1) both; }
@keyframes mdlin { from { opacity: 0; transform: translate(-50%, -46%) scale(.97); } to { opacity: 1; transform: translate(-50%, -50%); } }

/* toast + dialog */
.ptoast { position: absolute; left: 0; right: 0; bottom: 24px; margin: 0 auto; width: max-content; max-width: 720px; z-index: 900; background: #0b1220; color: #fff; padding: 12px 18px; border-radius: 12px;
  font: 500 13.5px Inter, sans-serif; display: flex; gap: 10px; align-items: center; box-shadow: 0 12px 40px rgba(16, 24, 40, .3); animation: toastin .35s cubic-bezier(.2, 1.2, .4, 1) both; }
.ptoast.out { animation: fadeout .3s ease both; }
.ptoast .ic { color: #34d399; width: 17px; height: 17px; }
@keyframes toastin { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.pdlg-bg { position: absolute; inset: 0; background: rgba(11, 18, 32, .45); z-index: 800; display: grid; place-items: center; animation: fadein .25s ease both; }
.pdlg { width: 440px; background: #fff; border-radius: 18px; padding: 22px; box-shadow: 0 12px 40px rgba(16, 24, 40, .2); animation: pop .35s cubic-bezier(.2, 1.2, .4, 1) both; font-family: Inter, sans-serif; }
.pdlg h3 { margin: 0 0 6px; font-size: 18px; } .pdlg p { margin: 0 0 14px; color: var(--ink2); font-size: 13.5px; line-height: 1.5; }
.pdlg input { width: 100%; height: 42px; border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px; font: 14px Inter, sans-serif; outline: none; }
.pdlg input:focus { border-color: var(--ink); }
.pdlg .acts { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

/* inputs */
.in2 { width: 100%; height: 42px; border: 1.5px solid var(--line); border-radius: 11px; padding: 0 12px; font: 14px Inter, sans-serif; color: var(--ink); outline: none; background: #fff; }
textarea.in2 { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.5; }
.in2:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(11, 18, 32, .06); }

/* ---------- interview room (dark focus mode) ---------- */
.room { position: absolute; inset: 0; background: radial-gradient(1100px 600px at 40% 20%, #16213a 0%, #0a0e17 62%); color: #e7ebf3; display: flex; flex-direction: column; }
.rtop { height: 60px; display: flex; align-items: center; gap: 16px; padding: 0 28px; border-bottom: 1px solid rgba(255, 255, 255, .07); flex: none; }
.rtop .qd { display: flex; gap: 5px; } .rtop .qd i { width: 22px; height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .14); } .rtop .qd i.d { background: #34d399; } .rtop .qd i.c { background: #a5b4fc; }
.rtimer { font: 600 14px 'JetBrains Mono', monospace; background: rgba(255, 255, 255, .07); padding: 6px 12px; border-radius: 9px; }
.rbody { flex: 1; display: grid; min-height: 0; }
.rbody.voice { grid-template-columns: 1fr; }
.rbody.work { grid-template-columns: 1fr 380px; gap: 18px; padding: 18px 24px 0; }
.rstage { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 40px; text-align: center; min-height: 0; }
.orbw { position: relative; display: grid; place-items: center; }
.orb2 { border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c7d2fe 0%, #818cf8 30%, #5b5bf0 55%, #1e1b6b 100%); box-shadow: 0 0 60px rgba(99, 102, 241, .5); animation: br 3.2s ease-in-out infinite; }
.speaking .orb2 { animation: tk .42s ease-in-out infinite alternate; }
.thinking .orb2 { animation: br 1s ease-in-out infinite; filter: saturate(.6); }
@keyframes br { 50% { transform: scale(1.04); } } @keyframes tk { from { transform: scale(.97); } to { transform: scale(1.09); } }
.rng { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(129, 140, 248, .55); opacity: 0; }
.speaking .rng { animation: rg 1.8s ease-out infinite; } .speaking .rng:nth-child(2) { animation-delay: .6s; }
@keyframes rg { from { transform: scale(1); opacity: .7; } to { transform: scale(1.7); opacity: 0; } }
.rstate { margin-top: 22px; font-size: 13px; color: #a5b4fc; display: flex; align-items: center; gap: 8px; height: 20px; }

.v-signin .form .sub{ color: var(--ink2); margin-top: 8px; font-size: 14.5px; }
.v-signin .soc{ display: grid; gap: 10px; margin-top: 28px; }
.v-signin .soc .btn{ height: 46px; width: 100%; font-size: 14.5px; }
.v-signin .g{ width: 18px; height: 18px; border-radius: 50%; background: conic-gradient(#ea4335 0 25%, #fbbc05 0 50%, #34a853 0 75%, #4285f4 0); position: relative; }
.v-signin .g::after{ content: ''; position: absolute; inset: 4px; border-radius: 50%; background: #fff; }
.v-signin .or{ display: flex; align-items: center; gap: 12px; margin: 22px 0; color: var(--ink3); font-size: 12.5px; }
.v-signin .or::before, .v-signin .or::after{ content: ''; flex: 1; height: 1px; background: var(--line); }
.v-signin .fld{ margin-bottom: 14px; }
.v-signin .fld label{ display: flex; font-size: 13px; font-weight: 500; color: var(--ink2); margin-bottom: 6px; }
.v-signin .fld label a{ margin-left: auto; color: var(--ink); font-weight: 600; }
.v-signin .fld input{ width: 100%; height: 46px; border: 1.5px solid var(--line); border-radius: 11px; padding: 0 14px; font: 14.5px Inter, sans-serif; outline: none; transition: border-color .2s, box-shadow .2s; }
.v-signin .fld input:focus{ border-color: var(--ink); box-shadow: 0 0 0 3px rgba(11,18,32,.08); }
.v-signin .fld.err input{ border-color: var(--red); }
.v-signin .fld .em{ color: var(--red); font-size: 12px; margin-top: 5px; display: none; }
.v-signin .fld.err .em{ display: block; }
.v-signin .btn.blk{ background: var(--ink); color: #fff; border-color: var(--ink); height: 46px; width: 100%; font-size: 15px; margin-top: 6px; }
.v-signin .sw{ text-align: center; margin-top: 18px; font-size: 14px; color: var(--ink2); }
.v-signin .sw a{ color: var(--ink); font-weight: 600; }
.v-signin .terms{ font-size: 12px; color: var(--ink3); text-align: center; margin-top: 16px; line-height: 1.5; }
.v-signin .right{ background: linear-gradient(160deg, #0f1b2d 0%, #13294b 55%, #134e4a 100%); color: #fff; padding: 56px; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.v-signin .right::after{ content: ''; position: absolute; right: -120px; bottom: -120px; width: 460px; height: 460px; border-radius: 50%; background: radial-gradient(circle, rgba(52,211,153,.3), transparent 65%); }
.v-signin .right h2{ font-size: 34px; letter-spacing: -.03em; line-height: 1.15; position: relative; z-index: 1; }
.v-signin .right .pts{ margin-top: 26px; position: relative; z-index: 1; }
.v-signin .right .pt{ display: flex; gap: 12px; align-items: center; font-size: 15px; color: #d7e0ee; padding: 7px 0; }
.v-signin .right .pt .ic{ color: #34d399; }
.v-signin .mock{ margin-top: 36px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 18px; width: 420px; position: relative; z-index: 1; backdrop-filter: blur(6px); animation: fl_v_signin 6s ease-in-out infinite; }
@keyframes fl_v_signin{ 50% { transform: translateY(-8px); } }
.v-signin .gauge{ width: 76px; height: 76px; border-radius: 50%; background: conic-gradient(#34d399 78%, rgba(255,255,255,.12) 0); display: grid; place-items: center; flex: none; }
.v-signin .gauge b{ width: 62px; height: 62px; border-radius: 50%; background: #13294b; display: grid; place-items: center; font-size: 20px; }
.v-signin .bars div{ display: flex; align-items: center; gap: 10px; font-size: 12px; color: #b8c4d6; margin: 5px 0; }
.v-signin .bars i{ flex: 1; height: 6px; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; }
.v-signin .bars i::after{ content: ''; display: block; height: 100%; width: var(--w); background: #34d399; border-radius: 4px; }
/* =====================================================================
   NextTel visual system v3 — "solid"
   One neutral base, one accent, flat surfaces, hairline borders.
   No gradients, no glows, no rainbow icon tiles. Themes only swap tokens.
   ===================================================================== */

/* ---------- palettes ---------- */
:root, :root[data-theme="lime"] {
  --font: 'Geist', 'Inter', system-ui, sans-serif;
  --mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;
  --serif: 'Instrument Serif', Georgia, serif;
  --bg: #f4f4f1; --surface: #fff; --ink: #111211; --ink2: #4b4d4a; --ink3: #6f716d; --line: #e3e3de; --line2: #eeeeea;
  --brand: #4d8a0a; --brand-d: #3b6b06; --brand-50: #f0f6e1; --brand-100: #dcebbd;
  --hi: #c8f169;              /* highlight on dark surfaces */
  --cta: #111211; --cta-ink: #fff;
  --dark: #111211; --dark2: #1b1c1b; --dark-line: rgba(255, 255, 255, .09);
}
:root[data-theme="forest"] {
  --bg: #f5f4ef; --ink: #10140f; --ink2: #474c45; --ink3: #6b7068; --line: #e2e1da; --line2: #eeede7;
  --brand: #13784c; --brand-d: #0e5c3a; --brand-50: #e7f1eb; --brand-100: #c9e2d3;
  --hi: #7fe0ac; --cta: #0e5c3a; --cta-ink: #fff;
  --dark: #0f1a14; --dark2: #16241c; --dark-line: rgba(255, 255, 255, .09);
}
:root[data-theme="ember"] {
  --bg: #f6f4f1; --ink: #141210; --ink2: #4d4945; --ink3: #726d68; --line: #e5e1dc; --line2: #f0ede9;
  --brand: #e2531c; --brand-d: #b53f10; --brand-50: #fdeee6; --brand-100: #f9d4c1;
  --hi: #ff7a45; --cta: #141210; --cta-ink: #fff;
  --dark: #141210; --dark2: #1e1b18; --dark-line: rgba(255, 255, 255, .09);
}
:root {
  /* the old "AI indigo" and "info blue" collapse into neutrals: one accent only */
  --ai: var(--ink); --ai-50: var(--line2); --ai-100: var(--line);
  --blue: var(--ink2); --blue-50: var(--line2);
  --amber: #b45f06; --amber-50: #fbf2e4; --red: #d4361f; --red-50: #fbebe7;
  --r: 12px; --r-lg: 14px;
  --sh: none;
  --sh-lg: 0 1px 2px rgba(17, 18, 17, .06), 0 12px 32px rgba(17, 18, 17, .10);
}

/* ---------- type ---------- */
body, #frame, .ptoast, .pdlg, .pdlg input, .in2, kbd, #guide, #guide-btn, #guide button, .v-signin .fld input { font-family: var(--font) !important; }
#me-menu { font-family: var(--font) !important; border-radius: 12px !important; }
body { letter-spacing: -.006em; font-feature-settings: 'ss01', 'cv11'; }
.rtimer, .code2 textarea, .code2 .gut, .code2 .tests { font-family: var(--mono) !important; }
.h1, .h2, .pg h1, .hm h1 { font-weight: 600; letter-spacing: -.035em; }
.pg h1, .hm h1 { font-size: 32px; }
.h3 { font-weight: 600; letter-spacing: -.01em; }
b, strong { font-weight: 600; }
.hstats b, .mring b, .rtimer, .ring b { font-variant-numeric: tabular-nums; }
.hstats b { font-weight: 500; font-size: 28px; letter-spacing: -.04em; }

/* ---------- surfaces ---------- */
html, body { background: #e9e9e5; }
#stage { background: #e9e9e5; }
#frame { border-radius: 10px; box-shadow: 0 0 0 1px rgba(17, 18, 17, .08), 0 24px 60px rgba(17, 18, 17, .14); }
.card { border-radius: var(--r); box-shadow: none; }

/* brand mark: a solid square with an accent notch, replaces the gradient sparkle */
.logo { width: 26px !important; height: 26px !important; border-radius: 7px; background: var(--ink) !important; box-shadow: none !important; position: relative; }
.logo .ic { display: none; }
.logo::after { content: ''; position: absolute; right: 5px; bottom: 5px; width: 7px; height: 7px; border-radius: 2px; background: var(--hi); }
.brand { font-weight: 700; font-size: 17px; letter-spacing: -.035em; gap: 9px; }
.avatar { background: var(--ink) !important; color: #fff; font-weight: 600; font-size: 12px; width: 34px; height: 34px; }

/* ---------- nav: text tabs with an underline, no pills ---------- */
.nav2 { height: 60px; gap: 36px; }
.nav2 .tabs { align-self: stretch; gap: 2px; }
.nav2 .tabs a { padding: 0 12px; border-radius: 0; font-size: 14px; position: relative; display: flex; align-items: center; }
.nav2 .tabs a:hover { background: none; }
.nav2 .tabs a.on { background: none; }
.nav2 .tabs a.on::after { display: block; content: ''; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 0; background: var(--ink); }

/* ---------- buttons ---------- */
.btn { border-radius: 8px; height: 40px; font-weight: 550; box-shadow: none !important; }
.btn.sm { border-radius: 7px; height: 32px; }
.btn.lg { border-radius: 9px; height: 46px; }
.btn.pri, .btn.blk, .btn.ai, .btn.dark { background: var(--cta) !important; border-color: var(--cta) !important; color: var(--cta-ink) !important; }
#frame .btn:hover { filter: none; background-color: var(--bg); }
#frame .btn.pri:hover, #frame .btn.blk:hover, #frame .btn.ai:hover { filter: brightness(1.18); }

/* ---------- icon tiles: neutral outline, never tinted ---------- */
.ib { background: var(--surface) !important; color: var(--ink) !important; border: 1px solid var(--line); border-radius: 9px; }
.ib[style*="border-radius:50%"] { background: var(--brand-50) !important; color: var(--brand-d) !important; border-color: transparent; }
.room .ib, .board2 .node .ib { border-radius: 7px; }

/* company marks: monochrome initials */
.logoq { background: var(--line2) !important; color: var(--ink) !important; border-radius: 8px; font-weight: 600 !important; box-shadow: inset 0 0 0 1px var(--line); }

/* ---------- chips & tags ---------- */
.chip { border-radius: 6px; height: 26px; padding: 0 9px; font-size: 12.5px; }
.chip.a, .chip.b { background: var(--line2); color: var(--ink); }
.chip.g { background: var(--brand-50); color: var(--brand-d); }
.chip.o { background: var(--amber-50); color: var(--amber); }
.chip.r { background: var(--red-50); color: var(--red); }
.tchip { border-radius: 8px; border-width: 1px; height: 34px; }
.tchip.on { background: var(--ink); border-color: var(--ink); }

/* ---------- inputs and controls ---------- */
.seg { border-radius: 10px; padding: 3px; }
.seg span { border-radius: 7px; padding: 7px 14px; }
.seg span.on { box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(17, 18, 17, .06); }
.tile { border-radius: 10px; border-width: 1px; }
.tile.on, .opt2.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.opt2 { border-radius: 10px; border-width: 1px; }
.in2, .pdlg input { border-width: 1px; border-radius: 8px; }
.in2:focus { box-shadow: 0 0 0 3px var(--line2); }
.jrow, .arow { border-radius: 10px; border-width: 1px; }
.jrow.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }

/* match score: thin single-colour ring */
.mring { --c: var(--brand) !important; width: 42px; height: 42px; }
.mring b { width: 37px; height: 37px; font-size: 12px; font-weight: 600; }
.bar > i { background: var(--ink); }

/* ---------- overlays ---------- */
.sheet { box-shadow: -1px 0 0 var(--line), -24px 0 48px rgba(17, 18, 17, .10); }
.dim, .pdlg-bg { background: rgba(17, 18, 17, .32); }
.mdl, .pdlg { border-radius: 14px; box-shadow: var(--sh-lg); }
.ptoast { background: var(--dark); border-radius: 10px; }
.ptoast .ic { color: var(--hi); }
.steps3 div i { height: 3px; }
.steps3 div.dn { color: var(--ink); } .steps3 div.dn i { background: var(--brand); }
.edit2, .imp2 { border-radius: 10px; }
.sugg, .hsug { border-radius: 8px; color: var(--amber); }
.sugg.ok, .hsug.ok { color: var(--brand-d); }
.quote2 { color: #6b3a03; border-radius: 0 8px 8px 0; }
.better2 { color: var(--brand-d); border-radius: 0 8px 8px 0; }
.edit2 ins { color: var(--brand-d); }

/* ---------- home ---------- */
.hnext { background: var(--dark); border-radius: 12px; }
.hnext .logoq { background: rgba(255, 255, 255, .1) !important; color: #fff !important; box-shadow: none; }
.hnext [style*="9fb0c8"] { color: var(--hi) !important; font-family: var(--mono); font-weight: 500 !important; font-size: 11.5px !important; }
.hnext .btn { background: transparent; border-color: rgba(255, 255, 255, .22); color: #fff; }
.hnext .btn:last-child { background: #fff !important; color: var(--ink); border-color: #fff; }
#frame .hnext .btn:hover { background-color: rgba(255, 255, 255, .08); }
.hstats { border-radius: 12px; }
.hstats svg path { stroke: var(--ink); } .hstats svg circle { fill: var(--brand); }
.hc { border-radius: 12px; }
.hc-r, .hthumb { border-radius: 8px; }
.ck.on { background: var(--ink); border-color: var(--ink); }

/* ---------- interview room: flat dark, a calm voice mark instead of a glossy orb ---------- */
.room { background: var(--dark); color: #ecedea; }
.rtop { border-bottom-color: var(--dark-line); }
.room .logo { background: rgba(255, 255, 255, .1) !important; }
.rtop .qd i { background: rgba(255, 255, 255, .12); border-radius: 2px; } .rtop .qd i.d { background: var(--hi); } .rtop .qd i.c { background: #fff; }
.rtimer { background: rgba(255, 255, 255, .06); border-radius: 7px; font-weight: 500; }
.orb2 { background: radial-gradient(circle, var(--hi) 0 26%, rgba(255, 255, 255, .04) 27%) !important; border: 1px solid rgba(255, 255, 255, .16); box-shadow: none !important; }
.thinking .orb2 { filter: none; opacity: .7; }
.rng { border: 1px solid var(--hi); }
.rq { font-weight: 500; letter-spacing: -.02em; }
.ra { color: #b5b8b2; }
.ra::before { color: var(--hi); font-family: var(--mono); font-weight: 500; }
.rbtn { background: rgba(255, 255, 255, .07); }
.rbtn.mic { background: var(--hi) !important; color: var(--dark); }
.rbtn.mic.muted { background: var(--red) !important; color: #fff; }
.rpill { background: rgba(255, 255, 255, .07); border-radius: 8px; }
.wv2 i { background: var(--hi); }
.wpanel { border-radius: 10px; }
.code2 { background: var(--dark2); border-color: var(--dark-line); }
.code2 .tests { background: rgba(0, 0, 0, .25); }
.code2 textarea { caret-color: var(--hi); }
.board2 { background-color: #fafaf8; background-image: radial-gradient(#d6d6d0 1px, transparent 1px); }
.board2 .node { border-radius: 8px; border-width: 1px; box-shadow: 0 1px 2px rgba(17, 18, 17, .06); }
.board2 .node.hl { border-color: var(--ink); box-shadow: 0 0 0 3px var(--line); }
.board2 svg path { stroke: #8a8c86; } .board2 svg path.dash { stroke: var(--brand); }
.donebox { background: rgba(17, 18, 17, .6); }
.donebox > div { border-radius: 14px; }

/* ---------- landing ---------- */
#frame .v-landing .lnav { height: 68px; }
#frame .v-landing .badge { border-radius: 6px; height: 28px; font-family: var(--mono); font-size: 12px; letter-spacing: .01em; background: var(--line2); }
#frame .v-landing .badge b { border-radius: 4px; background: var(--hi); color: var(--ink); font-family: var(--mono); font-weight: 500; }
#frame .v-landing .hero h1 { font-size: 64px; font-weight: 600; letter-spacing: -.05em; line-height: 1.02; }
#frame .v-landing .hero h1 span { font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -.02em; color: var(--ink); }
#frame .v-landing .hero .ctas .btn { border-radius: 9px; height: 46px; }
#frame .v-landing .fine .ic { color: var(--ink); }
#frame .v-landing .vc { border-radius: 14px; box-shadow: 0 1px 2px rgba(17, 18, 17, .05), 0 16px 40px rgba(17, 18, 17, .08); }
#frame .v-landing .int { background: var(--dark); }
#frame .v-landing .orb { background: radial-gradient(circle, var(--hi) 0 26%, rgba(255, 255, 255, .05) 27%); border: 1px solid rgba(255, 255, 255, .16); box-shadow: none; }
#frame .v-landing .wv i { background: var(--hi); }
#frame .v-landing .ring { background: conic-gradient(var(--brand) 94%, var(--line2) 0); }
#frame .v-landing .match .chip.g { background: var(--line2); color: var(--ink); }
#frame .v-landing .lsec .eyebrow { font-family: var(--mono); font-weight: 500; font-size: 12px; color: var(--ink3); letter-spacing: .06em; }
#frame .v-landing .lsec h2 { font-weight: 600; letter-spacing: -.04em; font-size: 42px; }
#frame .v-landing .pc { border-radius: 14px; }
#frame .v-landing .pc:hover { transform: none; box-shadow: none; border-color: var(--ink); }
#frame .v-landing .pc li .ic { color: var(--ink); }
#frame .v-landing .st { border-radius: 14px; }
#frame .v-landing .st .n { border-radius: 7px; font-family: var(--mono); font-weight: 500; }
#frame .v-landing .band { border-radius: 16px; background: var(--dark); }
#frame .v-landing .band::after { display: none; }
#frame .v-landing .band .btn { background: var(--hi) !important; border-color: var(--hi) !important; color: var(--ink) !important; }

/* ---------- sign in ---------- */
#frame .v-signin .right { background: var(--dark); }
#frame .v-signin .right::after { display: none; }
#frame .v-signin .right h2 { font-weight: 600; letter-spacing: -.04em; }
#frame .v-signin .right .pt .ic { color: var(--hi); }
#frame .v-signin .mock { background: rgba(255, 255, 255, .04); border-color: var(--dark-line); border-radius: 12px; backdrop-filter: none; }
#frame .v-signin .gauge { background: conic-gradient(var(--hi) 78%, rgba(255, 255, 255, .1) 0); }
#frame .v-signin .gauge b { background: var(--dark); font-weight: 500; }
#frame .v-signin .bars i::after { background: var(--hi); }
#frame .v-signin .fld input { border-width: 1px; border-radius: 8px; }
#frame .v-signin .fld input:focus { box-shadow: 0 0 0 3px var(--line2); }

/* ---------- prototype chrome ---------- */
#guide-btn { background: var(--ink); border-radius: 9px; box-shadow: none; }
#guide { border-radius: 12px; }
#guide a.on { background: var(--ink); }
#guide .thm { display: flex; gap: 6px; padding: 10px 6px 2px; border-top: 1px solid #eeeeea; margin-top: 10px; align-items: center; font-size: 12px; color: #6f716d; }
#guide .thm button { margin-left: 0; display: flex; align-items: center; gap: 6px; }
#guide .thm button i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
#guide .thm button.on { border-color: #111211; font-weight: 600; }

/* ---------- refinements ---------- */
:root, :root[data-theme="lime"] { --ring: var(--ink); }
:root[data-theme="forest"], :root[data-theme="ember"] { --ring: var(--brand); }
.mring { --c: var(--ring) !important; }
#frame .v-landing .ring { background: conic-gradient(var(--ring) 94%, var(--line2) 0); }
#frame .v-landing .hero h1 span { display: inline-block; margin-top: 4px; }
#frame .v-landing .cv-mini > div { width: 595px; }
#frame .v-landing .int [style*="a5b4fc"] { color: #c9cbc6 !important; font-family: var(--mono); font-size: 11.5px !important; }
#frame .v-landing .int [style*="34d399"] { background: var(--hi) !important; }
#frame .v-landing .int [style*="d6dcf0"] { color: #ecedea !important; }
.rtop [style*="8b95ad"] { color: #8d908a !important; }
/* the landing CTA ".band" class also matches the resume header band; reset it inside the mini resume */
#frame .v-landing .rz .band { margin: 0; padding: 24px 34px 18px; border-radius: 0; display: block; background: var(--acc-dark); gap: 0; }
#arc { stroke: var(--ring); stroke-width: 7; }
.view circle[stroke="#eef1f5"] { stroke: var(--line2); stroke-width: 7; }


/* =====================================================================
   NextTel visual system v4 "professional" (2026-10-03)
   Calm slate neutrals, one deep petrol accent, no near-black, no acid
   highlight, no italic-serif flourish, mono type only for code and timers.
   Score colours are semantic and separate from the brand colour.
   ===================================================================== */
:root, :root[data-theme="petrol"] {
  --font: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
  --serif: 'Instrument Serif', Georgia, serif;
  --bg: #f4f6f7; --surface: #fff; --ink: #18232c; --ink2: #46515c; --ink3: #5f6a74; --line: #dde2e6; --line2: #edf0f2;
  --brand: #0f5f73; --brand-d: #0b4a5a; --brand-50: #e7f1f4; --brand-100: #c7e0e7;
  --hi: #9fd4de; --cta: #0f5f73; --cta-ink: #fff;
  --dark: #15262e; --dark2: #1c323b; --dark-line: rgba(255, 255, 255, .10);
  --ring: var(--brand);
}
:root[data-theme="lime"] {
  --bg: #f4f4f1; --ink: #1d211e; --ink2: #4b4d4a; --ink3: #626560; --line: #e1e1dc; --line2: #eeeeea;
  --brand: #3f7208; --brand-d: #335c06; --brand-50: #eef5e0; --brand-100: #d8e9b8;
  --hi: #c8f169; --cta: #26302a; --cta-ink: #fff; --dark: #1f2622; --dark2: #283029; --ring: var(--brand);
}
:root[data-theme="forest"] { --ink3: #62675f; --dark: #14241c; }
:root[data-theme="ember"] { --brand: #c4471a; --ink3: #67625d; --cta: #2a221d; --dark: #241c17; --dark2: #2e241e; --hi: #ffb08f; }
:root {
  --success: #2c7a3f; --success-50: #e7f3ea;
  --amber: #9a5005; --amber-50: #fbf1e3; --red: #b93a22; --red-50: #fbebe7;
  --r: 10px; --r-lg: 12px;
}

/* type: one sans family, modest tracking */
body { letter-spacing: 0; font-feature-settings: normal; }

function every(ms, fn) { const tk = token; const id = setInterval(() => { if (tk === token) fn(); else clearInterval(id); }, ms); timers.push(id); return id; }
const sleep = (ms) => new Promise((res) => after(ms, res));
function tween(ms, fn) { const tk = token, t0 = performance.now(); const st = (now) => { if (tk !== token) return; const p = Math.min(1, (now - t0) / ms); fn(ease(p)); if (p < 1) requestAnimationFrame(st); }; requestAnimationFrame(st); }
async function typeText(el, text, cps = 45, paused = () => false) {
  for (let i = 1; i <= text.length; i += 2) { while (paused()) await sleep(120); el.textContent = text.slice(0, i); await sleep(2000 / cps); }
  el.textContent = text;
}
const show = (el, cls = 'show') => { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };

function toast(msg, ic = 'check') {
  $$('.ptoast', frame()).forEach((t) => t.remove());
  const t = document.createElement('div'); t.className = 'ptoast'; t.innerHTML = icon(ic) + `<span>${msg}</span>`; frame().appendChild(t);
  setTimeout(() => t.classList.add('out'), 2600); setTimeout(() => t.remove(), 2950);
}
function dialog({ title, text = '', input = null, ok = 'OK', cancel = 'Cancel', danger = false }) {
  return new Promise((resolve) => {
    const bg = document.createElement('div'); bg.className = 'pdlg-bg';
    bg.innerHTML = `<div class="pdlg"><h3>${title}</h3>${text ? `<p>${text}</p>` : ''}${input !== null ? `<input value="${esc(input)}">` : ''}
      <div class="acts">${cancel ? `<span class="btn" data-x="0">${cancel}</span>` : ''}<span class="btn ${danger ? '' : 'blk'}" data-x="1" ${danger ? 'style="background:#ef4444;border-color:#ef4444;color:#fff"' : ''}>${ok}</span></div></div>`;
    frame().appendChild(bg);
    const inp = $('input', bg); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
    const close = (v) => { bg.remove(); resolve(v); };
    bg.addEventListener('click', (e) => { const b = e.target.closest('[data-x]'); if (b) close(b.dataset.x === '1' ? (inp ? inp.value : true) : null); else if (e.target === bg) close(null); });
    if (inp) inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') close(inp.value); if (e.key === 'Escape') close(null); });
  });
}

const CODE_START = 'public int[][] merge(int[][] windows) {\n    // your code here\n    return windows;\n}\n';
const CODE_SOL = `public int[][] merge(int[][] windows) {
    if (windows.length <= 1) return windows;
    Arrays.sort(windows, (a, b) -> Integer.compare(a[0], b[0]));
    List<int[]> merged = new ArrayList<>();
    int[] cur = windows[0];
    for (int[] w : windows) {
        if (w[0] <= cur[1]) cur[1] = Math.max(cur[1], w[1]);
        else { merged.add(cur); cur = w; }
    }
    merged.add(cur);
    return merged.toArray(new int[0][]);
}
`;

    // code editor
    let ta, solved = false;
    if (mode === 'code') {
      ta = $('#ta', v); const gut = $('#gut', v);
      const lines = () => { gut.innerHTML = ta.value.split('\n').map((_, i) => i + 1).join('<br>'); gut.style.transform = `translateY(${-ta.scrollTop}px)`; };
      ta.value = CODE_START; lines(); ta.addEventListener('input', lines); ta.addEventListener('scroll', lines); v._lines = lines;
      ta.addEventListener('keydown', (e) => { if (e.key === 'Tab') { e.preventDefault(); const s = ta.selectionStart; ta.value = ta.value.slice(0, s) + '    ' + ta.value.slice(ta.selectionEnd); ta.selectionStart = ta.selectionEnd = s + 4; lines(); } });
      $('#run', v).addEventListener('click', () => runTests());
    }
    async function runTests() {
      const t = $('#tests', v); t.innerHTML = '<span style="color:#c9cbc6">Running 5 tests…</span>'; await sleep(800);

      if (ok) solved = true; return ok;
    }
    // whiteboard
    const box = (id) => { const e = $('#n-' + id, v); return { x: e.offsetLeft, y: e.offsetTop, w: e.offsetWidth, h: e.offsetHeight }; };
    const edge = (r, px, py) => { const cx = r.x + r.w / 2, cy = r.y + r.h / 2, dx = px - cx, dy = py - cy; const s = Math.min(Math.abs((r.w / 2 + 4) / (dx || 1e-6)), Math.abs((r.h / 2 + 4) / (dy || 1e-6))); return [cx + dx * s, cy + dy * s]; };
    const wires = () => $$('#wires path[data-a]', v).forEach((p) => { if (!$('#n-' + p.dataset.a, v) || !$('#n-' + p.dataset.b, v)) return; const A = box(p.dataset.a), B = box(p.dataset.b); const [x1, y1] = edge(A, B.x + B.w / 2, B.y + B.h / 2), [x2, y2] = edge(B, A.x + A.w / 2, A.y + A.h / 2); p.setAttribute('d', `M${x1} ${y1} L${x2} ${y2}`); });
    const addNode = (id) => {
      const [, t, s, ic, c, x, y] = NODES.find((n) => n[0] === id);
      const n = document.createElement('div'); n.className = 'node pop show'; n.id = 'n-' + id; n.style.left = x + 'px'; n.style.top = y + 40 + 'px';
      n.innerHTML = `<span class="ib ${c}">${icon(ic)}</span><div>${t}<small>${s}</small></div>`; $('#board', v).appendChild(n);
      WIRES.filter((w) => w.includes(id)).forEach(([a, b, d]) => { if ($(`#wires path[data-a="${a}"][data-b="${b}"]`, v)) return; const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.dataset.a = a; p.dataset.b = b; p.setAttribute('marker-end', 'url(#ah)'); if (d) p.classList.add('dash'); $('#wires', v).appendChild(p); });
      n.addEventListener('pointerdown', (e) => { e.preventDefault(); n.setPointerCapture(e.pointerId); const sx = e.clientX, sy = e.clientY, ox = n.offsetLeft, oy = n.offsetTop;
        const mv = (ev) => { n.style.left = Math.max(0, ox + (ev.clientX - sx) / S.scale) + 'px'; n.style.top = Math.max(0, oy + (ev.clientY - sy) / S.scale) + 'px'; wires(); };
        const up = () => { n.removeEventListener('pointermove', mv); n.removeEventListener('pointerup', up); }; n.addEventListener('pointermove', mv); n.addEventListener('pointerup', up); });
      wires();
    };
    const effects = {
      code: async () => { for (let i = 0; i <= CODE_SOL.length; i += 5) { while (paused) await sleep(100); ta.value = CODE_SOL.slice(0, i); v._lines(); await sleep(14); } ta.value = CODE_SOL; v._lines(); },
      run: async () => { if (!solved) await runTests(); },
      nodes: async () => { for (const id of ['client', 'gw', 'pay', 'db', 'kafka', 'work']) { addNode(id); await wait(450); } },
      dlq: async () => { addNode('dlq'); $('#n-dlq', v).classList.add('hl'); await wait(1500); $('#n-dlq', v)?.classList.remove('hl'); },
      part: async () => { $('#n-kafka', v)?.classList.add('hl'); $('#n-kafka small', v).textContent = 'partitioned by user ID'; },
    };
    (async () => {
      await wait(900);
      for (const [who, text, fx] of script) {
        if (who === 'ai') {
          qi++; qmark(); $('#ra', v).textContent = '';
          state('speaking', 'Maya is speaking', '#c9cbc6'); await typeText($('#rq', v), text, 42, () => paused);
          if (fx) { state('thinking', 'Waiting for your code…', '#fbbf24'); await effects[fx](); }

          state('', 'Listening…', 'var(--hi)'); $('#you', v).classList.add('talking');
          const fxp = fx ? effects[fx]() : null;
          await typeText($('#ra', v), text, 40, () => paused || muted); await fxp;
          $('#you', v).classList.remove('talking'); state('thinking', 'Thinking…', '#fbbf24'); await wait(900);
        }
      }
      state('', 'Interview complete', 'var(--hi)');
      S.lastReport = { type: st.type, score: { code: 81, board: 74 }[mode] || 78 };
      S.history.unshift({ type: st.type, score: S.lastReport.score, when: 'Today' });
      const d = document.createElement('div'); d.className = 'donebox';
      d.innerHTML = `<div><div class="ib g" style="margin:0 auto;width:52px;height:52px;border-radius:50%">${icon('check')}</div><div class="h2" style="margin-top:14px">Nice work, ${esc(S.profile.name.split(' ')[0])}</div>
        <div class="muted" style="margin-top:6px;font-size:14px">Your report is ready, with what to improve and stronger answers.</div><span class="btn blk lg" style="margin-top:18px" data-go="report">See my report${icon('arrow')}</span></div>`;

  },
};

// ---------- landing motion (v4.1) ----------
const ROLES = [['💻', 'SDE-1', 'Hyderabad'], ['📊', 'Data Analyst', 'Pune'], ['⚙️', 'Backend Engineer', 'Bengaluru'], ['🎨', 'Frontend Developer', 'Chennai'],
  ['🧠', 'ML Engineer', 'Remote'], ['📦', 'Product Analyst', 'Gurugram'], ['🎓', 'Campus placements', '2026 batch'], ['☁️', 'DevOps Engineer', 'Remote'],
  ['🧪', 'QA Engineer', 'Noida'], ['📱', 'Android Developer', 'Mumbai']];
const MAYA_QS = ['How would you make the payments API idempotent?', 'Tell me about a time you disagreed with your lead.',
  'Design a URL shortener for 10 million users a day.', 'Why Kafka here, and not a simple queue?'];
function landingMotion(v) {
  const calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const alive = () => v.isConnected;
  // scrolling strip of roles (duplicated once for a seamless loop)
  const chips = ROLES.map(([e, r, c]) => `<span class="mc">${e} <b>${r}</b> · ${c}</span>`).join('');
  $('#mqin', v).innerHTML = chips + chips;
  // stickers around the hero cards
  $('.vis', v).insertAdjacentHTML('beforeend', '<span class="stk s1">🔥 5-day streak</span><span class="stk s2">🎉 Offer from Helio Pay</span><span class="stk s3">📈 ATS +21</span>');
  // scroll reveal, staggered per section
  v.classList.add('rv-on');
  $$('.lsec', v).forEach((sec) => $$('.eyebrow, h2, .lead, .pc, .st, .fq', sec).forEach((el, i) => { el.classList.add('rv'); el.style.setProperty('--i', i); }));
  const band = $('.band', v); if (band) band.classList.add('rv');
  const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { root: v, threshold: .15 });
  $$('.rv', v).forEach((el) => io.observe(el));
  if (calm) return;
  // rotating badge text
  const badge = $('.badge', v);
  if (badge) {
    const txt = [...badge.childNodes].find((n) => n.nodeType === 3 && n.textContent.trim());
    const rot = document.createElement('span'); rot.className = 'rot'; rot.textContent = txt ? txt.textContent : '';
    if (txt) txt.replaceWith(rot);
    const lines = ['Live AI voice interviews', 'Resume tailored in 60 s', 'Jobs matched to you', 'Honest gap analysis'];
    let k = 0;
    const t = setInterval(() => {
      if (!alive()) return clearInterval(t);
      rot.className = 'rot out';
      setTimeout(() => { k = (k + 1) % lines.length; rot.textContent = lines[k]; rot.className = 'rot in'; }, 220);
    }, 2800);
  }
  // Maya types her question, waits, erases, moves to the next one
  const q = $('.int [style*="d6dcf0"]', v);
  if (q) {
    q.classList.add('tw-q');
    let qi = 0, ci = 0, dir = 1, hold = 0;
    const t = setInterval(() => {
      if (!alive()) return clearInterval(t);
      const full = '"' + MAYA_QS[qi] + '"';
      if (hold > 0) { hold--; return; }
      ci += dir;
      if (ci >= full.length) { ci = full.length; dir = -1; hold = 60; }
      if (ci <= 0) { ci = 0; dir = 1; hold = 8; qi = (qi + 1) % MAYA_QS.length; }
      q.textContent = full.slice(0, ci);
    }, 38);
  }
}

const sparkline = (vals, w = 120, h = 34, color = '#12a150') => {
  const mx = Math.max(...vals), mn = Math.min(...vals), r = mx - mn || 1;
  const pts = vals.map((v, i) => [i * (w / (vals.length - 1 || 1)), h - 4 - ((v - mn) / r) * (h - 8)]);
  return `<svg viewBox="0 0 ${w} ${h}" style="width:${w}px;height:${h}px"><path d="M${pts.map((p) => p.join(' ')).join(' L')}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="3.5" fill="${color}"/></svg>`;
};

    apps.filter((a) => /Submitted|Applied/.test(a.st)).slice(0, 2).forEach((a) => act.push(['send', 'g', `Application sent to ${JOBS[a.id].co}`, a.st.split('· ')[1] || 'recently']));
    hist.slice(0, 2).forEach((h) => act.push(['chart', 'a', `${TYPES[h.type].label} report · score ${h.score}`, h.when]));
    if (S.hasResume) act.push(['file', 'o', `Resume updated · ATS ${atsScore()}`, 'Today']);
    const bottomRight = `<div class="card hb"><div class="row"><span class="h3">Recent activity</span></div>
      ${act.length ? act.slice(0, 4).map(([ic, c, t, w]) => `<div class="hl2"><span class="ib ${c}" style="width:30px;height:30px;border-radius:8px">${icon(ic)}</span><span style="font-size:13px">${t}</span><span class="sp"></span><span class="faint" style="font-size:12px">${w}</span></div>`).join('')
        : '<div class="hc-empty">Your interviews, resume updates and applications will show up here.</div>'}</div>`;

    return `<div class="pg hm">
      <div class="row" style="align-items:flex-end"><div><h1>${greet()}, ${esc(first)}</h1><div class="lead">${isNew ? 'Let\'s set you up. It takes about a minute.' : need.length ? `You have ${need.length} application${need.length > 1 ? 's' : ''} waiting for you${iv ? ' and an interview on Friday' : ''}.` : 'Here\'s where your job search stands.'}</div></div>
        <span class="sp"></span><span class="faint" style="font-size:13px">${new Date().toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long' })}</span></div>
      ${iv && S.hasResume ? `<div class="hnext"><span class="logoq" style="background:#0ea5a4;width:46px;height:46px;font-size:18px">H</span>
        <div style="flex:1"><div style="font-size:12px;color:#9fb0c8;font-weight:600;letter-spacing:.05em">UP NEXT · FRIDAY 11:00 · 90 MIN</div><div style="font-size:18px;font-weight:700;margin-top:3px">Helio Pay technical interview</div>
          <div style="color:#c8d3e6;font-size:13px;margin-top:2px">Coding + system design. We built a mock from this job's description.</div></div>
        <div class="row gap8"><span class="btn" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.18);color:#fff" data-go="jobs" data-q="job=helio">View job</span><span class="btn lg" style="background:#fff;color:var(--ink);border-color:#fff" data-go="interview" data-q="type=job&job=helio"><i data-i="play"></i>Practice now</span></div></div>` : ''}
      ${stats}
      <div class="hgrid">${ivCard}${rsCard}${jbCard}</div>
      <div class="hrow">${bottomLeft}${bottomRight}</div>
    </div>`;
  },
  mount: (v) => {
    v.classList.add('scroll');
    const cv = $('#hcv', v); if (cv) renderCV(cv);
  },
};

// ---------- v3 visual system: theme switcher + icon tweaks ----------
// The sparkle glyph reads as "generic AI"; hints and suggestions use a lightbulb instead.
ICONS.spark = '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>';
ACC.c1 = ['#1f2b33', '#c9d4db', '#3d5566'];
const THEMES = [['petrol', 'Petrol', '#0f5f73'], ['forest', 'Forest', '#13784c'], ['ember', 'Ember', '#c4471a'], ['lime', 'Graphite', '#3f7208']];
function setTheme(k) {
  document.documentElement.dataset.theme = k;
  try { localStorage.setItem('nt-theme-v4', k); } catch (e) {}
  $$('#guide .thm button').forEach((b) => b.classList.toggle('on', b.dataset.th === k));
}
document.addEventListener('DOMContentLoaded', () => {
  let saved = null; try { saved = localStorage.getItem('nt-theme-v4'); } catch (e) {}
  const t = document.createElement('div'); t.className = 'thm';
  t.innerHTML = 'Theme' + THEMES.map(([k, l, c]) => `<button data-th="${k}"><i style="background:${c}"></i>${l}</button>`).join('');
  $('#guide').appendChild(t);
  t.addEventListener('click', (e) => { const b = e.target.closest('[data-th]'); if (b) { e.stopPropagation(); setTheme(b.dataset.th); } });
  const q = new URLSearchParams(location.search).get('theme');
  setTheme(q || saved || document.documentElement.dataset.theme || 'petrol');
});

</script>
